[package]
name = "core-agent"
version = "0.1.0"
edition = "2021"
description = "Hound — Behavioral endpoint protection for your Mac"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
libc = "0.2"
notify = "6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.30"
uuid = { version = "1.8", features = ["v4", "serde"] }
walkdir = "2.5"

[[bin]]
name = "watchdog"
path = "src/bin/watchdog.rs"